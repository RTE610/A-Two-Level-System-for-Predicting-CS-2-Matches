name: Task
description: Planned work item from the sprint backlog
labels: ["type:task"]
body:
  - type: input
    id: innovation
    attributes:
      label: Innovation / requirement
      placeholder: I6 / FR-2
  - type: textarea
    id: outcome
    attributes:
      label: Expected outcome
      description: What will work when the task is done
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate (SP)
