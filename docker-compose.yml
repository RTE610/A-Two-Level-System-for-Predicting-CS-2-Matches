services:
  api:
    build: .
    container_name: cs2-api
    command: uvicorn services.api.app:app --host 0.0.0.0 --port 8000
    environment:
      - DATA_DIR=/app/data
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./mlflow.db:/app/mlflow.db:ro
      # MLflow stores absolute artifact paths, so mount them at the same path as on the host
      - ./mlruns:${PWD}/mlruns:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ui:
    build: .
    container_name: cs2-ui
    command: >
      streamlit run ui/app.py
      --server.address=0.0.0.0
      --server.port=8501
      --browser.gatherUsageStats=false
    environment:
      - API_URL=http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  train:
    build: .
    command: python scripts/run_temporal.py --mode fast --split temporal --extra-test-json /app/data/matches_v2_post_cutoff.json
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow.db
    volumes:
      - ./data:/app/data:ro
      - ./mlflow.db:/app/mlflow.db
      - ./mlruns:${PWD}/mlruns
      - ./results:/app/results
    profiles: ["jobs"]
